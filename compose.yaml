name: tuneforge-ai

services:
  # ==========================================
  # Database Service: PostgreSQL 16
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: tuneforge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tuneforge}
      POSTGRES_USER: ${POSTGRES_USER:-tuneforge_user}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
    ports:
      # Bound to 127.0.0.1 (localhost only) for host access/Prisma migrations
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tuneforge_user} -d ${POSTGRES_DB:-tuneforge}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tuneforge_network

  # ==========================================
  # Backend Service: Node.js / Express API
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tuneforge_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-tuneforge_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tuneforge}?schema=public"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      JWT_SECRET: ${JWT_SECRET:-tuneforge_jwt_secret_change_in_production}
      AI_API_KEY: ${AI_API_KEY:-}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - tuneforge_network

  # ==========================================
  # Frontend Service: React / Vite SPA + Nginx
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "/api/v1"
    container_name: tuneforge_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - tuneforge_network

volumes:
  postgres_data:
    name: tuneforge_postgres_data

networks:
  tuneforge_network:
    name: tuneforge_network
    driver: bridge
